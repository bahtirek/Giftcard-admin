name: Build and Deploy Angular to HawkHost

on:
  push:
    branches:
      - main # Change this if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Add this line so it can calculate file changes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Match your local Node.js version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production

      - name: Sync files to HawkHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HAWKHOST_FTP_SERVER }}
          username: ${{ secrets.HAWKHOST_FTP_USERNAME }}
          password: ${{ secrets.HAWKHOST_FTP_PASSWORD }}
          # Angular builds to 'dist/[project-name]/browser' or just 'dist/[project-name]'
          # Check your angular.json file under "outputPath" to confirm this path
          local-dir: ./dist/giftcard-admin/browser/
          server-dir: ''
          dangerous-clean-slate: true # Set to true if you want to delete old files on the server first
