<div class="shell" id="shell">

  <!-- ══════════ SIDEBAR ══════════ -->
  <sidebar (openModalEvent)="openModal($event)" />

  <!-- ══════════ TOPBAR ══════════ -->
  <header class="navbar" role="banner">
    <button class="icon-btn hidden" id="menu-btn" aria-label="Open menu" onclick="document.getElementById('sidebar').classList.toggle('is-open')" style="display:none">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
    </button>

    <div class="search-box flex-1" style="max-inline-size:320px" role="search">
      <i class="ti ti-search text-tertiary" aria-hidden="true"></i>
      <input type="search" placeholder="Search accounts, cards, orders…" aria-label="Search" />
    </div>

    <div class="navbar__actions ms-auto">
      <button class="icon-btn relative" aria-label="Notifications">
        <i class="ti ti-bell" aria-hidden="true"></i>
        <span class="notif-dot" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme" id="theme-btn">
        <i class="ti ti-moon" aria-hidden="true"></i>
      </button>
      <button class="btn btn--primary" onclick="openModal('modal-giftcard')">
        <i class="ti ti-plus" aria-hidden="true"></i>New Gift Card
      </button>
    </div>
  </header>

  <!-- ══════════ MAIN ══════════ -->
  <main class="main" id="main-content">
    <div class="flex flex-col gap-md p-md" style="max-inline-size:1400px;margin-inline:auto">

      <!-- ── DASHBOARD VIEW ── -->
      <router-outlet />

      <!-- ── ACCOUNTS VIEW ── -->


      <!-- ── GIFT CARDS VIEW ── -->

      <!-- ── ORDERS VIEW (Admin only) ── -->


      <!-- ── SETTINGS VIEW ── -->


    </div>
  </main>
</div>

<!-- ══════════════════════════════════════════
     MODALS
══════════════════════════════════════════ -->

<!-- New Account -->

<new-account-modal (modalCloseEvent)="closeModal('isNewAccountModalOpen')" [isModalOpen]="modals().isNewAccountModalOpen" />

<!-- Edit Account -->
<edit-account-modal (modalCloseEvent)="closeModal('isEditAccountModalOpen')" [isModalOpen]="modals().isEditAccountModalOpen" />

<!-- New Gift Card -->
<new-giftcard-modal (modalCloseEvent)="closeModal('isGiftcardModalOpen')" [isModalOpen]="modals().isGiftcardModalOpen" />

<!-- Edit Gift Card -->
<edit-giftcard-modal (modalCloseEvent)="closeModal('isGiftcardEditModalOpen')" [isModalOpen]="modals().isGiftcardEditModalOpen" />

<!-- Order Detail (Admin only) -->
<order-modal (modalCloseEvent)="closeModal('isOrderModalOpen')" [isModalOpen]="modals().isOrderModalOpen" />

<!-- Cancel Confirm -->
<cancel-order-modal (modalCloseEvent)="closeModal('isCancelModalOpen')" [isModalOpen]="modals().isCancelModalOpen" />

<script>
// ── Role state ──
let currentRole = 'admin'; // 'admin' | 'salesperson'

function applyRole(role) {
  currentRole = role;
  const isAdmin = role === 'admin';
  // Orders section
  document.getElementById('admin-section-label').style.display = isAdmin ? '' : 'none';
  document.getElementById('nav-orders').style.display = isAdmin ? '' : 'none';
  // Badge + avatar
  document.getElementById('role-badge').textContent = isAdmin ? 'Admin' : 'Sales';
  document.getElementById('role-badge').className = isAdmin ? 'badge badge--brand' : 'badge badge--info';
  document.getElementById('user-avatar').className = isAdmin ? 'user-avatar role-admin' : 'user-avatar role-sales';
  document.getElementById('user-role-label').textContent = isAdmin ? 'Administrator' : 'Salesperson';
  // If on orders view as salesperson, go to dashboard
  if (!isAdmin && document.getElementById('view-orders').classList.contains('is-active')) {
    nav(document.querySelector('.sidenav-link'), 'view-dashboard');
  }
}

function switchRole() {
  applyRole(currentRole === 'admin' ? 'salesperson' : 'admin');
}

// ── Navigation ──
function nav(btn, viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('is-active'));
  document.getElementById(viewId).classList.add('is-active');
  document.querySelectorAll('.sidenav-link').forEach(l => l.classList.remove('is-active'));
  if (btn) btn.classList.add('is-active');
}

// ── Modals ──
function openModal(id) {
  const m = document.getElementById(id);
  if (m) { m.classList.add('is-open'); document.body.style.overflow = 'hidden'; }
}
function closeModal(id) {
  const m = document.getElementById(id);
  if (m) { m.classList.remove('is-open'); document.body.style.overflow = ''; }
}
// Close on backdrop click
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(modal.id); });
});
// Close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal.is-open').forEach(m => closeModal(m.id));
});

// ── Gift card view toggle ──
function setGcView(v) {
  document.getElementById('gc-grid-view').classList.toggle('hidden', v !== 'grid');
  document.getElementById('gc-list-view').classList.toggle('hidden', v !== 'list');
  document.getElementById('gc-grid-btn').className = v === 'grid' ? 'btn btn--outline btn--sm' : 'btn btn--ghost btn--sm';
  document.getElementById('gc-list-btn').className = v === 'list' ? 'btn btn--outline btn--sm' : 'btn btn--ghost btn--sm';
}

// ── Order tab filter ──
function filterOrders(el, status) {
  document.querySelectorAll('.tabs__item').forEach(t => t.classList.remove('is-active'));
  el.classList.add('is-active');
}

// ── Dark mode ──
let dark = false;
function toggleTheme() {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('theme-btn').querySelector('i').className = dark ? 'ti ti-sun' : 'ti ti-moon';
}
</script>
