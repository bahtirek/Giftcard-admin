<div class="card">
  <div class="card__header"><span class="card__title">Security</span></div>
  <div class="card__body flex flex-col gap-md">
    <div class="field"><label class="field__label">Current password</label><input class="input" type="password" placeholder="••••••••" /></div>
    <div class="grid-2 gap-md">
      <div class="field"><label class="field__label">New password</label><input class="input" type="password" placeholder="••••••••" /></div>
      <div class="field"><label class="field__label">Confirm password</label><input class="input" type="password" placeholder="••••••••" /></div>
    </div>
  </div>
  <div class="card__footer flex justify-end gap-md">
    <button class="btn btn--outline" (click)="onCancel()">Cancel</button>
    <button class="btn btn--primary" (click)="onSaveButtonClick()">Save changes</button>
  </div>
</div>
