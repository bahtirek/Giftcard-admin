        <table class="table">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr (click)="openUserDetails('id')" class="cursor-pointer">
                    <td>
                        <div class="flex items-center gap-sm">
                            <div class="c-avatar" style="background:#dbeafe;color:#1e40af">JL</div>
                            <div>
                                <div class="font-medium">Jamie Lee</div>
                            </div>
                        </div>
                    </td>
                    <td class="text-secondary">mom@email.com</td>
                    <td class="font-medium">1561561561</td>
                    <td class="text-secondary text-xs">Sales person</td>
                    <td class="text-secondary text-xs">
                      <span class="badge badge--dot" [appStatusBadge]="'Active'">Active</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="card__footer justify-between">
        <span class="text-xs text-secondary">Showing 1 of 1 orders</span>
        <div class="flex gap-xs">
