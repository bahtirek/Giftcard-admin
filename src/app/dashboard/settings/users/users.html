<div class="card">
    <div class="table-wrapper no-border">
        <table class="table">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
              @for(user of users(); track user.id ) {
                <tr (click)="openUserDetails(user)" class="cursor-pointer">
                    <td>
                        <div class="flex items-center gap-sm">
                            <div class="c-avatar" style="background:#dbeafe;color:#1e40af">JL</div>
                            <div>
                                <div class="font-medium">{{user?.firstName}} {{user?.lastName}}</div>
                            </div>
                        </div>
                    </td>
                    <td class="text-secondary">{{user?.email}}</td>
                    <td class="font-medium">{{user?.phone}}</td>
                    <td class="text-secondary text-xs">{{user?.role}}</td>
                    <td class="text-secondary text-xs">
                      <span class="badge badge--dot" [appStatusBadge]="user?.status">{{user?.status}}</span>
                    </td>
                </tr>
              }
            </tbody>
        </table>
    </div>
    <div class="card__footer justify-between">
        <!-- <span class="text-xs text-secondary">Showing 1 of 1 users</span> -->
        <!-- <div class="flex gap-xs">
            <button class="btn btn--outline btn--sm" disabled>‹ Prev</button>
            <button class="btn btn--outline btn--sm">Next ›</button>
        </div> -->
    </div>
</div>
