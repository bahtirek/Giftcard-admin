<div class="flex flex-col gap-md pt-md">
  <div class="grid-2 gap-md">
    <app-input
      [inputFormField]="userForm.firstName()"
      [label]="'First Name'"
      [placeholder]="'e.g. Starbucks Corp.'"
      [required]="true"
    />
    <app-input
      [inputFormField]="userForm.lastName()"
      [label]="'Last Name'"
      [placeholder]="'e.g. Starbucks Corp.'"
      [required]="true"
    />
  </div>
  <div class="grid-2 gap-md">
    <app-input
      [inputFormField]="userForm.email()"
      [label]="'Email'"
      [placeholder]="'example@example.com'"
      [required]="true"
    />
    <app-input
      [inputFormField]="userForm.phone()"
      [label]="'Phone'"
      [placeholder]="'1561561561'"
      [required]="true"
    />
  </div>
  <div class="grid-2 gap-md">
    <app-select
      [inputFormField]="userForm.role()"
      [label]="'Role'"
      [placeholder]="'Role'"
      [required]="true"
      [options]="rolesOptions()"
    />
    <app-select
      [inputFormField]="userForm.status()"
      [label]="'Status'"
      [placeholder]="'Status'"
      [required]="true"
      [options]="statusOptions()"
    />
  </div>
</div>
