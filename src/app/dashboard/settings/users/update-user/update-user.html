<div class="view flex items-start justify-center">
  <div class="w-full max-w-2xl">
  <div class="mb-md">
    <h1 class="text-xl font-semibold text-primary leading-snug">Edit user</h1>
    <p class="text-sm text-secondary mt-xs">Update user user.</p>
  </div>
  <div class="card">
    <div class="card__body">
      <app-user-form (submitUser)="onUserSubmitEvent($event)" [user]="user()"></app-user-form>
    </div>
    <div class="card__footer flex justify-end gap-md">
      <button class="btn btn--outline" (click)="onCancel()">Cancel</button>
      <button class="btn btn--primary" (click)="onSubmitButtonClick()">Update User</button>
    </div>
  </div>
  </div>
</div>
