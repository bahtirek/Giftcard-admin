@switch (businessType()){
  @case ('Restaurant') {
    <div style="font-size:1.25rem">🍴</div>
  }
  @case ('Retail') {
    <div style="font-size:1.25rem">🛍️</div>
  }
  @case ('Service') {
    <div style="font-size:1.25rem">💈</div>
  }
  @case ('Grocery') {
    <div style="font-size:1.25rem">🛒</div>
  }
  @case ('Entertainment') {
    <div style="font-size:1.25rem">🍿</div>
  }
  @case ('Other') {
    <div style="font-size:1.25rem">🏷️</div>
  }
}
