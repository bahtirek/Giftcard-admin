<modal (modalCloseEvent)="closeModal()" [isModalOpen]="isModalOpen()">
  <div modal-header>
    <div><h2 class="modal__title" id="modal-account-title">Create New Account</h2><p class="text-sm text-secondary mt-xs">Add a new business account to the platform.</p></div>
  </div>
  <div modal-body>
      <account-form></account-form>
  </div>
  <div modal-footer>
      <button class="btn btn--outline" (click)="closeModal()">Cancel</button>
      <button class="btn btn--primary ml-md">Create Account</button>
  </div>
</modal>
