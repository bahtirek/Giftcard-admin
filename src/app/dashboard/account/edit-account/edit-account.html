<div class="view flex items-start justify-center">
  <div class="w-full max-w-2xl">
  <div class="mb-md">
    <h1 class="text-xl font-semibold text-primary leading-snug">Edit Account</h1>
    <p class="text-sm text-secondary mt-xs">Update existing business account.</p>
  </div>
  <div class="card">
    <div class="card__body">
      <account-form (submitAccount)="onAccountSubmitEvent($event)" [account]="account"></account-form>
    </div>
    <div class="card__footer flex justify-end gap-md">
      <button class="btn btn--outline" (click)="onCancel()">Cancel</button>
      <button class="btn btn--primary" (click)="onSubmitButtonClick()">Update Account</button>
    </div>
  </div>
  </div>
</div>
