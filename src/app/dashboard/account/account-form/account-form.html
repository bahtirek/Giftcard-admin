<div class="flex flex-col gap-md pt-md">
    <app-input
      [inputFormField]="accountForm.businessName()"
      [label]="'Business Name'"
      [placeholder]="'e.g. Starbucks Corp.'"
      [required]="true"
    />
    <div class="grid-2 gap-md">
      <app-select
        [inputFormField]="accountForm.businessType()"
        [label]="'Business Type'"
        [placeholder]="'Select business type'"
        [required]="true"
        [options]="options()"
      />
      <app-select
        [inputFormField]="accountForm?.status()"
        [label]="'Status'"
        [placeholder]="'Status'"
        [required]="true"
        [options]="statusOptions()"
      />
    </div>
    <div class="grid-2 gap-md">
      <app-input
        [inputFormField]="accountForm.email()"
        [label]="'Contact email'"
        [placeholder]="'contact@business.com'"
        [required]="true"
        [type]="'email'"
      />

      <app-input
        [inputFormField]="accountForm.phone()"
        [label]="'Contact phone'"
        [placeholder]="'99 123 4567'"
        [required]="true"
        [type]="'tel'"
      >
      <span prepend class="input-group__addon">+998</span>
    </app-input>
    </div>
<!--     <app-input
      [inputFormField]="accountForm.website()"
      [label]="'Website'"
      [placeholder]="'example.com'"
    >
      <span prepend class="input-group__addon">https://</span>
    </app-input> -->

    <app-input
      [inputFormField]="accountForm.address.addressLineOne()"
      [label]="'Address Line 1'"
      [placeholder]="'123 Main St'"
      [required]="true"
    />
    <!-- <div class="grid-2 gap-md"> -->
      <app-input
        [inputFormField]="accountForm.address.addressLineTwo()"
        [label]="'Address Line 2'"
        [placeholder]="'Apt 4B'"
      />
      <app-input
        [inputFormField]="accountForm.address.city()"
        [label]="'City'"
        [placeholder]="'City'"
        [required]="true"
      />
    <!-- </div> -->
    <div class="grid-2 gap-md">
      <app-input
        [inputFormField]="accountForm.address.state()"
        [label]="'State'"
        [placeholder]="'State'"
        [required]="true"
      />
      <app-input
        [inputFormField]="accountForm.address.zipCode()"
        [label]="'Zip Code'"
        [placeholder]="'Zip Code'"
        [required]="true"
      />
    </div>
    <app-textarea
      [inputFormField]="accountForm.notes()"
      [label]="'Notes'"
      [placeholder]="'Internal notes about this account…'"
    />
</div>
