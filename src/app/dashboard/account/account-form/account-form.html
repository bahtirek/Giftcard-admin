<div class="flex flex-col gap-md">
    <div class="grid-2 gap-md">
      <app-input
        [inputFormField]="accountForm.businessName()"
        [label]="'Business Name'"
        [placeholder]="'e.g. Starbucks Corp.'"
        [required]="true"
      />
      <app-select
        [inputFormField]="accountForm.businessType()"
        [label]="'Business Type'"
        [placeholder]="'Select business type'"
        [required]="true"
        [options]="options()"
      />
    </div>
    <div class="grid-2 gap-md">
      <app-input
        [inputFormField]="accountForm.businessName()"
        [label]="'Contact email'"
        [placeholder]="'contact@business.com'"
        [required]="true"
        [type]="'email'"
      />

      <app-input
        [inputFormField]="accountForm.phone()"
        [label]="'Contact phone'"
        [placeholder]="'99 123 4567'"
        [required]="true"
        [type]="'tel'"
      >
      <span prepend class="input-group__addon">+998</span>
    </app-input>
    </div>
    <app-input
      [inputFormField]="accountForm.website()"
      [label]="'Website'"
      [placeholder]="'example.com'"
    >
      <span prepend class="input-group__addon">https://</span>
    </app-input>

    <app-input
      [inputFormField]="accountForm.address()"
      [label]="'Address'"
      [placeholder]="'123 Main St, City, State'"
      [required]="true"
    />
    <app-textarea
      [inputFormField]="accountForm.notes()"
      [label]="'Notes'"
      [placeholder]="'Internal notes about this account…'"
    />
</div>
