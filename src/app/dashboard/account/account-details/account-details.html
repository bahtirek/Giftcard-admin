  <main class="main">
    <div class="flex flex-col gap-md p-md" style="max-inline-size:1280px;margin-inline:auto">

      <!-- ── Account hero ── -->
      <app-account-hero [account]="account.value()" />

      <!-- ── Stat tiles ── -->
      <app-account-stats />

      <!-- ── TAB: Locations & Gift Cards ── -->
      <div class="content-split" id="tab-locations">
        <div class="flex flex-col gap-md">

          <div class="flex justify-between items-center mb-xs">
            @if(account.value()?.giftCards?.length! > 0){
              <span class="text-sm font-semibold text-primary">{{ account.value()?.giftCards?.length }} Gift Cards</span>
            }
            <!-- <button class="btn btn--outline btn--sm"><i class="ti ti-plus" aria-hidden="true"></i>Add Card</button> -->
            <button class="btn btn--primary btn-sm ml-auto" tabindex="0" (click)="onAddCardButtonClicked()"><i aria-hidden="true" class="ti ti-plus"></i>Add Card</button>
          </div>

          @for(giftCardId of account.value()?.giftCards; track giftCardId) {
            <app-card-row [giftCardId]="giftCardId" (onGiftCardViewEvent)="onGiftCardViewEvent($event)" />
          }

          <app-orders-table />

          <app-account-activity />

          <!-- <app-business-info [account]="account.value()" /> -->
        </div>

        <!-- side: contacts + quick info -->
        <app-info-col />

      </div>
    </div>
  </main>
