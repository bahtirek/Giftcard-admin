<div class="account-hero">
  <div class="account-logo" aria-hidden="true">☕</div>
  <div class="flex-1 min-w-0">
    <div class="flex items-center gap-sm flex-wrap">
      <h1 class="text-xl font-semibold text-primary">{{ account()?.businessName}}</h1>
      <span class="badge badge--success badge--dot">Active</span>
      <span class="badge badge--neutral">{{ account()?.businessType }}</span>
    </div>
    <p class="text-sm text-secondary mt-xs">{{ account()?.notes }}</p>
    <div class="flex gap-lg mt-sm flex-wrap">
      <div class="flex items-center gap-xs text-xs text-tertiary">
        <i class="ti ti-mail" aria-hidden="true"></i>{{ account()?.email }}
      </div>
      <div class="flex items-center gap-xs text-xs text-tertiary">
        <i class="ti ti-phone" aria-hidden="true"></i>{{ account()?.phone }}
      </div>
      <div class="flex items-center gap-xs text-xs text-tertiary">
        <i class="ti ti-world" aria-hidden="true"></i>{{ account()?.website }}
      </div>
      <div class="flex items-center gap-xs text-xs text-tertiary">
        <i class="ti ti-calendar" aria-hidden="true"></i>Joined {{ account()?.createdAt | date: 'MMM d, y' }}
      </div>
    </div>
  </div>
  <div class="flex gap-xs flex-wrap">
    <button class="btn btn--outline btn--sm"><i class="ti ti-mail" aria-hidden="true"></i>Contact</button>
    <button class="btn btn--outline btn--sm" (click)="onAddCardButtonClicked()"><i class="ti ti-plus" aria-hidden="true"></i>Add Card</button>
  </div>
</div>
