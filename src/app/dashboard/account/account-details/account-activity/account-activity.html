<div id="tab-activity">
  <div class="card">
    <div class="card__header"><span class="card__title">Account Activity</span></div>
    <div class="card__body">
      <div class="timeline-item">
        <div class="timeline-dot" style="background:var(--color-success-bg);color:var(--color-success)"><i class="ti ti-plus" aria-hidden="true"></i></div>
        <div class="flex-1 min-w-0 pb-sm">
          <div class="text-sm text-primary"><strong class="font-medium">New gift card</strong> added: SeaTac Airport Kiosk</div>
          <div class="text-xs text-tertiary mt-xs">2 days ago · by Alex Doe</div>
        </div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot" style="background:var(--color-info-bg);color:var(--color-info)"><i class="ti ti-edit" aria-hidden="true"></i></div>
        <div class="flex-1 min-w-0 pb-sm">
          <div class="text-sm text-primary"><strong class="font-medium">Account updated</strong> — contact phone changed</div>
          <div class="text-xs text-tertiary mt-xs">5 days ago · by Alex Doe</div>
        </div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot" style="background:var(--bg-subtle);color:var(--text-tertiary)"><i class="ti ti-ban" aria-hidden="true"></i></div>
        <div class="flex-1 min-w-0 pb-sm">
          <div class="text-sm text-primary"><strong class="font-medium">Location deactivated</strong> — Tacoma Mall</div>
          <div class="text-xs text-tertiary mt-xs">2 weeks ago · by Sam Rivera</div>
        </div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot" style="background:var(--color-brand-subtle);color:var(--color-brand)"><i class="ti ti-building-store" aria-hidden="true"></i></div>
        <div class="flex-1 min-w-0">
          <div class="text-sm text-primary"><strong class="font-medium">Account created</strong> — Starbucks Corp. onboarded</div>
          <div class="text-xs text-tertiary mt-xs">Jan 12, 2024 · by Sam Rivera</div>
        </div>
      </div>
    </div>
  </div>
</div>
