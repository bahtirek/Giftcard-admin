<div class="view flex items-start justify-center">
  <div class="w-full max-w-2xl">
  <div class="mb-md">
    <h1 class="text-xl font-semibold text-primary leading-snug">Edit Gift Card</h1>
    <p class="text-sm text-secondary mt-xs">Edit the details of the gift card.</p>
  </div>
  <div class="card">
    <div class="card__body">
      <app-gift-card-form (submitGiftCard)="onGiftCardSubmitEvent($event)" [account]="account.value()" [giftCard]="giftCard()"></app-gift-card-form>
    </div>
    <div class="card__footer flex justify-end gap-md">
      <button class="btn btn--outline" (click)="onCancel()">Cancel</button>
      <button class="btn btn--primary" (click)="onSubmitButtonClick()">Update Gift Card</button>
    </div>
  </div>
  </div>
</div>
