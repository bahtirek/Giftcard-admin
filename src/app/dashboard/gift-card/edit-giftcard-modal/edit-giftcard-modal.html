<modal (modalCloseEvent)="closeModal()" [isModalOpen]="isModalOpen()">
  <div modal-header>
    <div><h2 class="modal__title" id="modal-giftcard-edit-title">Edit Gift Card — Starbucks</h2></div>
  </div>
  <div modal-body class="flex flex-col gap-md">
      <div class="grid-2 gap-md">
        <div class="field"><label class="field__label">Account</label><select class="select"><option selected>Starbucks Corp.</option><option>Amazon Retail</option></select></div>
        <div class="field"><label class="field__label">Location</label><input class="input" type="text" value="Downtown Seattle" /></div>
      </div>
      <div class="field"><label class="field__label">Description</label><textarea class="textarea" rows="2">Treat yourself or a loved one to the finest coffee experience.</textarea></div>
      <div class="grid-3 gap-md">
        <div class="field"><label class="field__label">Preset amount 1</label><div class="input-group"><span class="input-group__addon">$</span><input class="input" type="number" value="25" /></div></div>
        <div class="field"><label class="field__label">Preset amount 2</label><div class="input-group"><span class="input-group__addon">$</span><input class="input" type="number" value="50" /></div></div>
        <div class="field"><label class="field__label">Max custom</label><div class="input-group"><span class="input-group__addon">$</span><input class="input" type="number" value="500" /></div></div>
      </div>
      <div class="field"><label class="field__label">Status</label><select class="select"><option>Active</option><option>Draft</option><option>Inactive</option></select></div>
  </div>
  <div modal-footer>
      <button class="btn btn--danger-outline btn--sm" style="margin-inline-end:auto"><i class="ti ti-trash" aria-hidden="true"></i>Delete Card</button>
      <button class="btn btn--outline ml-md" onclick="closeModal('modal-giftcard-edit')">Cancel</button>
      <button class="btn btn--primary ml-md">Save Changes</button>
  </div>
</modal>
