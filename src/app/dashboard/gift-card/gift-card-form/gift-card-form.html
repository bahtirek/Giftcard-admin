<div class="flex flex-col gap-md pt-md">
  <app-input
    [inputFormField]="giftCardForm.name()"
    [label]="'Store / Gift Card Name'"
    [placeholder]="'e.g. Starbucks'"
    [required]="true"
  />

  <div class="grid-2 gap-md">
    <app-select
      [inputFormField]="giftCardForm.type()"
      [label]="'Business Type'"
      [placeholder]="'Select business type'"
      [required]="true"
      [options]="options()"
    />

    <app-input
      [inputFormField]="giftCardForm?.phone()"
      [label]="'Contact phone'"
      [placeholder]="'99 123 4567'"
      [required]="true"
      [type]="'tel'"
    >
    <span prepend class="input-group__addon">+998</span>
  </app-input>
  </div>
  <div class="grid-2 gap-md">
    <app-input
      [inputFormField]="giftCardForm?.email()"
      [label]="'Contact email'"
      [placeholder]="'contact@business.com'"
      [required]="true"
      [type]="'email'"
    />
    <app-input
      [inputFormField]="giftCardForm?.website()"
      [label]="'Website'"
      [placeholder]="'example.com'"
    >
      <span prepend class="input-group__addon">https://</span>
    </app-input>
  </div>
  <app-textarea
    [inputFormField]="giftCardForm.description()"
    [label]="'Description'"
    [placeholder]="'Gift Card description...'"
    [required]="true"
  />
  <div class="flex gap-md">
    <app-input
      [inputFormField]="giftCardForm?.amount1()"
      [label]="'Amount 1'"
      [placeholder]="'100,000'"
    >
      <span prepend class="input-group__addon">$</span>
    </app-input>
    <app-input
      [inputFormField]="giftCardForm?.amount2()"
      [label]="'Amount 2'"
      [placeholder]="'500,000'"
    >
      <span prepend class="input-group__addon">$</span>
    </app-input>
    <app-input
      [inputFormField]="giftCardForm?.amount3()"
      [label]="'Amount 3'"
      [placeholder]="'1,000,000'"
    >
      <span prepend class="input-group__addon">$</span>
    </app-input>
  </div>
  <app-multi-file-input
    [inputFormField]="giftCardForm.imageFiles"
    [label]="'Image'"
    [placeholder]="'Image'"
    [existingImage]="[]"
    (filesChanged)="onFilesChanged($event)"
    (existingFilesChanged)="onExistingFilesChanged($event)"
    (existingFileRemoved)="onExistingFileRemoved($event)"
  />
  <app-checkbox
    [inputFormField]="addressCheckboxForm.checkbox()"
    [label]="'Use same address as on account'"
    [required]="false"
  />
  <app-input
    [inputFormField]="giftCardForm.address.addressLineOne()"
    [label]="'Address Line 1'"
    [placeholder]="'123 Main St'"
    [required]="true"
  />
  <app-input
    [inputFormField]="giftCardForm.address.addressLineTwo()"
    [label]="'Address Line 2'"
    [placeholder]="'Apt 4B'"
  />
  <app-input
    [inputFormField]="giftCardForm.address.city()"
    [label]="'City'"
    [placeholder]="'City'"
    [required]="true"
  />
  <div class="grid-2 gap-md">
    <app-input
      [inputFormField]="giftCardForm.address.state()"
      [label]="'State'"
      [placeholder]="'State'"
      [required]="true"
    />
    <app-input
      [inputFormField]="giftCardForm.address.zipCode()"
      [label]="'Zip Code'"
      [placeholder]="'Zip Code'"
      [required]="true"
    />
  </div>
</div>
