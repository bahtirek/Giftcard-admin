<button class="btn btn--ghost text-brand p-xs p-xs" (click)="back()">
  <i aria-hidden="true" class="ti ti-chevron-left"></i>
  Back
</button>
<!-- <button class="btn btn--ghost btn--sm p-xs"><i aria-hidden="true" class="ti ti-arrow-left"></i>Back</button> -->

<div class="search-box flex-1" style="max-inline-size:320px" role="search">
  <i class="ti ti-search text-tertiary" aria-hidden="true"></i>
  <input type="search" placeholder="Search accounts, cards, orders…" aria-label="Search" />
</div>

<div class="navbar__actions ms-auto">
  <div class="user-row mr-lg" id="user-row" (click)="goToSettings()">
    <div class="min-w-0">
      <div class="text-sm font-medium text-primary truncate" id="user-name">{{user().firstName}} {{user().lastName}}</div>
    </div>
    <div class="ms-auto flex gap-xs">
      <span class="badge badge--dot" [appRoleBadge]="user().role!">{{user().role}}</span>
    </div>
  </div>
  <button class="icon-btn relative" aria-label="Notifications">
    <i class="ti ti-bell" aria-hidden="true"></i>
    <span class="notif-dot" aria-hidden="true"></span>
  </button>
  <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme" id="theme-btn">
    <i class="ti ti-moon" aria-hidden="true"></i>
  </button>
  <button class="icon-btn" (click)="logout()" aria-label="Toggle theme" id="theme-btn">
    <i class="ti ti-logout" aria-hidden="true"></i>
  </button>
</div>
