<app-dropdown [options]="statusOptions()" (valueChange)="onStatusValueChanged($event)" [value]="defaultOption()">
  <span appDropdownTrigger class="badge badge--dot mr-md cursor-pointer" [appStatusBadge]="defaultOption()!">{{ defaultOption() }}</span>
</app-dropdown>

<modal (modalCloseEvent)="closeModal()" [isModalOpen]="isModalOpen()">
  <div modal-header>
    <div><h2 class="modal__title" id="modal-giftcard-edit-title">Status update</h2></div>
  </div>
  <div modal-body class="">
    Updating "{{name()}}" {{typeToUpdate()}} status to <span class="strong" >{{defaultOption()}}</span>
  </div>
  <div modal-footer>
      <button class="btn btn--danger-outline ml-md" (click)="closeModal()">Cancel</button>
      <button class="btn btn--primary ml-md" (click)="onUpdateButtonClicked()" >Update</button>
  </div>
</modal>
